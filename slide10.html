<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Practical Impact in Real Applications</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 5px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      perspective: 800px;
    }

    .slide-btn:active {
      transform: translateY(-50%) scale(0.95) rotateX(10deg);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .slide-btn-left {
      left: 20px;
      background: linear-gradient(145deg, #3498DB, #2980B9);
    }

    .slide-btn-right {
      right: 20px;
      background: linear-gradient(145deg, #E74C3C, #C0392B);
    }
  </style>
</head>
<body>
  <!-- Slide container -->
  <div class="flex flex-col justify-center items-center w-screen h-screen overflow-hidden"
       style="padding:50px;background:#ffffff;">

    <div class="w-full h-full flex flex-col">
      <div class="mb-12 text-center">
        <h1 class="text-gray-900 font-bold mb-3" style="font-size:42px;font-family:'Roboto',sans-serif;">Practical Impact in Real Applications</h1>
        <div class="bg-red-500 mx-auto" style="width:120px;height:4px;"></div>
      </div>

      <div class="flex gap-12">
        <!-- Left Card -->
        <div class="flex-1">
          <div class="bg-white rounded-lg p-8 shadow-2xl" style="background:rgba(255,255,255,0.95);">
            <h2 class="font-bold mb-6 text-gray-800" style="font-size:24px;font-family:'Roboto',sans-serif;">Common Failure Scenarios</h2>
            <div class="space-y-5">
              <div class="flex items-start gap-4">
                <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" style="background:#E74C3C;"><i class="fas fa-copy text-white"></i></div>
                <div>
                  <p class="font-semibold text-gray-800" style="font-size:18px;font-family:'Roboto Mono',monospace;">Duplicate entries in HashSet</p>
                </div>
              </div>
              <div class="flex items-start gap-4">
                <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" style="background:#E74C3C;"><i class="fas fa-user-lock text-white"></i></div>
                <div>
                  <p class="font-semibold text-gray-800" style="font-size:18px;font-family:'Roboto Mono',monospace;">Failed login validations</p>
                </div>
              </div>
              <div class="flex items-start gap-4">
                <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" style="background:#E74C3C;"><i class="fas fa-database text-white"></i></div>
                <div>
                  <p class="font-semibold text-gray-800" style="font-size:18px;font-family:'Roboto Mono',monospace;">Cache lookup failures</p>
                </div>
              </div>
              <div class="flex items-start gap-4">
                <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" style="background:#E74C3C;"><i class="fas fa-exclamation-triangle text-white"></i></div>
                <div>
                  <p class="font-semibold text-gray-800" style="font-size:18px;font-family:'Roboto Mono',monospace;">Incorrect business logic</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Card -->
        <div class="flex-1">
          <div class="bg-white rounded-lg p-8 shadow-2xl" style="background:rgba(255,255,255,0.95);">
            <h2 class="font-bold mb-6 text-gray-800" style="font-size:24px;font-family:'Roboto',sans-serif;">Affected Industries</h2>
            <div class="space-y-6">
              <div class="flex items-center gap-4 p-4 rounded-lg" style="background:rgba(52,152,219,0.1);border-left:4px solid #3498DB;">
                <i class="fas fa-university text-3xl" style="color:#3498DB;"></i>
                <p class="font-semibold text-gray-800" style="font-size:18px;font-family:'Roboto',sans-serif;">Banking Systems</p>
              </div>
              <div class="flex items-center gap-4 p-4 rounded-lg" style="background:rgba(52,152,219,0.1);border-left:4px solid #3498DB;">
                <i class="fas fa-shopping-cart text-3xl" style="color:#3498DB;"></i>
                <p class="font-semibold text-gray-800" style="font-size:18px;font-family:'Roboto',sans-serif;">E-commerce Platforms</p>
              </div>
              <div class="flex items-center gap-4 p-4 rounded-lg" style="background:rgba(52,152,219,0.1);border-left:4px solid #3498DB;">
                <i class="fas fa-building text-3xl" style="color:#3498DB;"></i>
                <p class="font-semibold text-gray-800" style="font-size:18px;font-family:'Roboto',sans-serif;">Enterprise Applications</p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 3D Slide Buttons -->
    <button class="slide-btn slide-btn-left" onclick="prevSlide()">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="slide-btn slide-btn-right" onclick="nextSlide()">
      <i class="fas fa-chevron-right"></i>
    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    const title = document.querySelector('h1');
    const subtitle = document.querySelector('h1+div');
    const leftCard = document.querySelectorAll('.flex.gap-12>div')[0];
    const rightCard = document.querySelectorAll('.flex.gap-12>div')[1];
    gsap.fromTo(title, { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: 'power3.out' });
    gsap.fromTo(subtitle, { scaleX: 0, transformOrigin: 'left' }, { scaleX: 1, duration: 0.6, delay: 0.3, ease: 'power2.out' });
    gsap.fromTo(leftCard, { x: -100, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, delay: 0.5, ease: 'power3.out' });
    gsap.fromTo(rightCard, { x: 100, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, delay: 0.7, ease: 'power3.out' });

    // Placeholder slide functions
    function prevSlide() {
      window.location.href = 'slide9.html'; // Replace with your logic
    }
    function nextSlide() {
      window.location.href = 'slide11.html'; // Replace with your logic
    }
  </script>
</body>
</html>
