    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            perspective: 800px;
        }

        .slide-btn:active {
            transform: translateY(-50%) scale(0.95) rotateX(10deg);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .slide-btn-left {
            left: 20px;
            background: linear-gradient(145deg, #3498DB, #2980B9);
        }

        .slide-btn-right {
            right: 20px;
            background: linear-gradient(145deg, #E74C3C, #C0392B);
        }

            <h1 class="title text-center font-bold mb-6"

            <div class="mainContentChild flex flex-col items-center space-y-6 w-full"

        <button class="slide-btn slide-btn-left" onclick="prevSlide()">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script>
        gsap.registerPlugin(SplitText);
        const title = document.querySelector('.title');
        const {
            background: titleBg,
            backgroundClip: titleBgClip
        } = getComputedStyle(title);
        const titleSplit = SplitText.create(title, {
            type: "chars, words, lines"
        });
        if (titleBgClip === 'text') {
            const {
                top,
                left,
                width,
                height
            } = title.getBoundingClientRect();
            titleSplit.chars.forEach(ele => {
                ele.style.background = titleBg;
                ele.style.backgroundClip = titleBgClip;
                ele.style.backgroundSize = `${width}px ${height}px`;
                const {
                    top: eTop,
                    left: eLeft
                } = ele.getBoundingClientRect();
                ele.style.backgroundPosition = `${left - eLeft}px ${top - eTop}px`;
            });
        }
        gsap.fromTo(titleSplit.chars, {
            opacity: 0,
            yPercent: "random([-150, 150])",
            xPercent: "random([-150, 150])"
        }, {
            opacity: 1,
            duration: 0.6,
            yPercent: 0,
            xPercent: 0,
            stagger: {
                from: "random",
                amount: 0.6
            },
            ease: "power3.out",
            onComplete: () => {
                titleSplit.revert();
            }
        });
        const subtitle = document.querySelector('.subtitle');
        const {
            background: subtitleBg,
            backgroundClip: subtitleBgClip
        } = getComputedStyle(subtitle);
        const subtitleSplit = SplitText.create(subtitle, {
            type: "chars, words, lines"
        });
        if (subtitleBgClip === 'text') {
            const {
                top,
                left,
                width,
                height
            } = subtitle.getBoundingClientRect();
            subtitleSplit.chars.forEach(ele => {
                ele.style.background = subtitleBg;
                ele.style.backgroundClip = subtitleBgClip;
                ele.style.backgroundSize = `${width}px ${height}px`;
                const {
                    top: eTop,
                    left: eLeft
                } = ele.getBoundingClientRect();
                ele.style.backgroundPosition = `${left - eLeft}px ${top - eTop}px`;
            });
        }
        gsap.fromTo(subtitleSplit.chars, {
            opacity: 0,
            yPercent: "random([-150, 150])",
            xPercent: "random([-150, 150])"
        }, {
            opacity: 1,
            duration: 0.6,
            yPercent: 0,
            xPercent: 0,
            stagger: {
                from: "random",
                amount: 0.6
            },
            ease: "power3.out",
            delay: 0.3,
            onComplete: () => {
                subtitleSplit.revert();
            }
        });
        const mainContentChild = document.querySelectorAll('.mainContentChild');
        mainContentChild.forEach((card, index) => {
            const delay = 0.8 + index * 0.15;
            const {
                opacity
            } = getComputedStyle(card);
            gsap.fromTo(card, {
                opacity: 0,
                x: 0,
                y: 800,
                z: -1500,
                scale: 0.1,
                rotationX: 45,
                rotationY: 0,
                rotationZ: 0
            }, {
                opacity,
                x: 0,
                y: 0,
                z: 0,
                scale: 1,
                rotationX: 0,
                rotationY: 0,
                rotationZ: 0,
                duration: 1.2,
                delay,
                ease: "power3.out",
                onStart: () => {
                    card.style.transition = "none";
                },
                onComplete: () => {
                    card.style.removeProperty('transition');
                }
            });
        });

        // Placeholder slide functions
        function prevSlide() {
            window.location.href = 'slide12.html'; // Replace with your logic
        }
        function nextSlide() {
            window.location.href = 'slide2.html'; // Replace with your logic
        }
    </script>
