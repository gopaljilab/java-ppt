<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Conclusion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* 3D slide buttons */
    .slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 5px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      perspective: 800px;
    }

    .slide-btn:active {
      transform: translateY(-50%) scale(0.95) rotateX(10deg);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .slide-btn-left {
      left: 20px;
      background: linear-gradient(145deg, #3498DB, #2980B9);
    }

    .slide-btn-right {
      right: 20px;
      background: linear-gradient(145deg, #E74C3C, #C0392B);
    }
  </style>
</head>
<body style="margin:0;padding:0;overflow:hidden;">
  <div class="flex flex-col justify-center w-screen h-screen overflow-hidden" style="padding:60px;background:#FFFFFF;">

    <div class="mb-12">
      <h1 class="text-5xl font-bold" style="color:#2C3E50;">Conclusion</h1>
      <div class="w-24 h-1 mt-4" style="background:#3498DB;"></div>
    </div>

    <div class="grid grid-cols-2 gap-8">
      <div class="flex items-start space-x-4 p-6 rounded-lg" style="background:#F8F9FA;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <div class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full" style="background:#3498DB;"><i class="fas fa-handshake text-white text-xl"></i></div>
        <div>
          <h3 class="text-xl font-bold mb-2" style="color:#2C3E50;">Critical Contract</h3>
          <p class="text-lg" style="color:#34495E;line-height:1.6;"><span class="px-2 py-1 rounded font-mono text-sm" style="background:#ECF0F1;color:#E74C3C;">equals()</span> and <span class="px-2 py-1 rounded font-mono text-sm" style="background:#ECF0F1;color:#E74C3C;">hashCode()</span> form a critical contract</p>
        </div>
      </div>
      <div class="flex items-start space-x-4 p-6 rounded-lg" style="background:#F8F9FA;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <div class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full" style="background:#3498DB;"><i class="fas fa-bolt text-white text-xl"></i></div>
        <div>
          <h3 class="text-xl font-bold mb-2" style="color:#2C3E50;">Powerful Impact</h3>
          <p class="text-lg" style="color:#34495E;line-height:1.6;">Simple syntax but powerful impact</p>
        </div>
      </div>
      <div class="flex items-start space-x-4 p-6 rounded-lg" style="background:#F8F9FA;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <div class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full" style="background:#3498DB;"><i class="fas fa-shield-alt text-white text-xl"></i></div>
        <div>
          <h3 class="text-xl font-bold mb-2" style="color:#2C3E50;">Essential Foundation</h3>
          <p class="text-lg" style="color:#34495E;line-height:1.6;">Essential for reliable Java applications</p>
        </div>
      </div>
      <div class="flex items-start space-x-4 p-6 rounded-lg" style="background:#F8F9FA;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <div class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full" style="background:#E74C3C;"><i class="fas fa-graduation-cap text-white text-xl"></i></div>
        <div>
          <h3 class="text-xl font-bold mb-2" style="color:#2C3E50;">Must Master</h3>
          <p class="text-lg" style="color:#34495E;line-height:1.6;">Core concept every Java developer must master</p>
        </div>
      </div>
    </div>

    <div class="mt-12 flex items-center justify-center">
      <div class="flex items-center space-x-3 px-6 py-3 rounded-lg" style="background:linear-gradient(135deg,#3498DB,#2C3E50);">
        <i class="fab fa-java text-white text-3xl"></i>
        <span class="text-2xl font-bold text-white">Master the Contract</span>
      </div>
    </div>

    <!-- 3D Slide Buttons -->
    <button class="slide-btn slide-btn-left" onclick="prevSlide()">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="slide-btn slide-btn-right" onclick="nextSlide()">
      <i class="fas fa-chevron-right"></i>
    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    const title = document.querySelector('h1');
    const titleLine = document.querySelector('.w-24');
    const cards = document.querySelectorAll('.grid>div');
    const footer = document.querySelector('.mt-12');
    gsap.fromTo(title, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' });
    gsap.fromTo(titleLine, { width: 0 }, { width: '6rem', duration: 0.6, delay: 0.3, ease: 'power2.out' });
    cards.forEach((card, index) => {
      gsap.fromTo(card, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, delay: 0.5 + index * 0.15, ease: 'power2.out' });
    });
    gsap.fromTo(footer, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, delay: 1.1, ease: 'back.out(1.2)' });

    // Slide navigation
    function prevSlide() {
      window.location.href = 'slide11.html';
    }
    function nextSlide() {
      window.location.href = 'slide1.html';
    }
  </script>
</body>
</html>
